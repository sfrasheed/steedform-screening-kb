name: Load the criteria into Deep Screen

# A rule change that never reaches the app is worse than no rule change: the
# repository says one thing and every screen keeps applying another. So pushing
# to main loads it, and nobody has to remember.
on:
  push:
    branches: [main]
    paths: ['[0-9][0-9]-*.md']
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A missing secret otherwise surfaces as curl exit 3 and nothing else,
      # which says the URL was malformed but not that it was never set.
      - name: Check the three secrets are present
        env:
          BASE: ${{ secrets.DEEP_SCREEN_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "${BASE:-}" ]      || missing="$missing DEEP_SCREEN_URL"
          [ -n "${CF_ID:-}" ]     || missing="$missing CF_ACCESS_CLIENT_ID"
          [ -n "${CF_SECRET:-}" ] || missing="$missing CF_ACCESS_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "Not set:$missing" >&2
            echo "Settings -> Secrets and variables -> Actions -> New repository secret" >&2
            exit 1
          fi
          # Values are masked in these logs, so say what is wrong, never what it is.
          case "$BASE" in
            https://*) ;;
            *) echo "DEEP_SCREEN_URL must start with https:// — it does not." >&2; exit 1 ;;
          esac
          case "$CF_ID" in
            *.access) ;;
            *) echo "CF_ACCESS_CLIENT_ID must end in .access — it does not." >&2; exit 1 ;;
          esac
          echo "All three are set and shaped correctly."

      - name: Send each rule file
        env:
          BASE: ${{ secrets.DEEP_SCREEN_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ACTOR: ${{ github.actor }}@steedform.com
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          added=0; replaced=0; same=0

          # Numbered files only. A README is not a rule, and loading one puts a
          # document into the screen that claims no authority and carries none.
          for f in [0-9][0-9]-*.md; do
            out=$(curl -sS -X POST "$BASE/api/kb" \
              -H "X-Actor: $ACTOR" \
              -H "CF-Access-Client-Id: $CF_ID" \
              -H "CF-Access-Client-Secret: $CF_SECRET" \
              -F "file=@$f" -F "name=$f")

            case "$out" in
              *'"unchanged":true'*) same=$((same+1));  echo "=  $f (already identical)" ;;
              *'"replaced":"kb_'*)  replaced=$((replaced+1)); echo "↻  $f (replaced)" ;;
              *'"id":"kb_'*)        added=$((added+1)); echo "+  $f" ;;
              *) echo "✗  $f — $out"; exit 1 ;;
            esac
          done

          echo
          echo "$added added · $replaced replaced · $same unchanged"
          echo "LOADED=$((added+replaced))" >> "$GITHUB_ENV"

      - name: Say which jobs are now screened against old rules
        env:
          BASE: ${{ secrets.DEEP_SCREEN_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          BASE="${BASE%/}"
          stale=$(curl -sS "$BASE/api/kb/stale" \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET")

          python3 - "$stale" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          d = json.loads(sys.argv[1])
          rows = d.get("stale", [])
          print("## Criteria loaded\n")
          print(f"Fingerprint `{d.get('fingerprint','')[:16]}…`\n")
          if not rows:
              print("Nothing open was screened against older rules.")
          else:
              # A rule can be corrected everywhere and still leave every job
              # already screened carrying the old answer. R-RESCREEN v1.
              print(f"**{len(rows)} open job(s) now screened against older rules — re-run them.**\n")
              for r in rows:
                  print(f"- {r.get('client_name') or r.get('reference')}")
          PY
